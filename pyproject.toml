[project]
name = "template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "robyn>=0.88.0",
    "taskiq>=0.12.6",
    "taskiq-redis>=1.2.3",
]

[tool.alembic]
script_location = "src/database/migrations"
prepend_sys_path = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv"]
indent-width = 4

[tool.ruff.lint]
select = [
    "BLE",
    "C90",
    "E",
    "F",
    "G",
    "I",
    "ICN",
    "ISC",
    "PLE",
    "Q",
    "RUF006",
    "RUF100",
    "T10",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = ["ISC001"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = "src.database.migrations.*"
ignore_errors = true
